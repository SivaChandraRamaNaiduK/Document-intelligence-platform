server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path that isn't a real
    # file should fall back to index.html so the app's router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html itself is not cached
    # so users always get the latest app shell.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}